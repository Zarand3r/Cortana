name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      # The suite is hermetic — no PyObjC / Ollama / network — so it runs on Linux.
      - name: Run CI gate (tests + branch coverage)
        run: python -m pytest --cov=cortana --cov-branch --cov-fail-under=95
