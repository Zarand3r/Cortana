<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cortana Chat — local</title>
<style>
  :root {
    --bg: #0f1117; --panel: #171a23; --panel-2: #1e222d; --line: #2a2f3b;
    --text: #e6e8ee; --muted: #9aa2b1; --accent: #7c9cff; --user: #2b3350;
    --radius: 14px; --maxw: 780px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column;
  }
  header {
    padding: 12px 20px; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 10px; flex: 0 0 auto;
  }
  header .dot { width: 9px; height: 9px; border-radius: 50%; background: #3ecf8e; box-shadow: 0 0 8px #3ecf8e; }
  header h1 { font-size: 15px; font-weight: 600; margin: 0; }
  header .sub { color: var(--muted); font-size: 12px; margin-left: auto; }
  #log { flex: 1 1 auto; overflow-y: auto; padding: 24px 16px; }
  .wrap { max-width: var(--maxw); margin: 0 auto; }
  .msg { display: flex; gap: 12px; padding: 12px 0; }
  .msg .who {
    flex: 0 0 30px; height: 30px; width: 30px; border-radius: 8px;
    display: grid; place-items: center; font-size: 13px; font-weight: 700;
  }
  .msg.user .who { background: var(--user); color: #cdd6ff; }
  .msg.assistant .who { background: var(--panel-2); color: var(--accent); }
  .msg .body { flex: 1 1 auto; white-space: pre-wrap; word-wrap: break-word; padding-top: 3px; }
  .msg .body .cursor { display: inline-block; width: 7px; height: 15px; background: var(--accent);
    vertical-align: text-bottom; animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .empty { color: var(--muted); text-align: center; margin-top: 18vh; }
  .empty h2 { color: var(--text); font-weight: 600; }
  footer { flex: 0 0 auto; border-top: 1px solid var(--line); padding: 14px 16px; }
  form { max-width: var(--maxw); margin: 0 auto; display: flex; gap: 10px; align-items: flex-end;
    background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 8px 8px 8px 14px; }
  textarea {
    flex: 1 1 auto; resize: none; border: 0; outline: 0; background: transparent;
    color: var(--text); font: inherit; max-height: 180px; padding: 6px 0;
  }
  button {
    flex: 0 0 auto; border: 0; border-radius: 10px; background: var(--accent); color: #0b1020;
    font-weight: 700; padding: 8px 16px; cursor: pointer; height: 38px;
  }
  button:disabled { opacity: .4; cursor: default; }
  .hint { max-width: var(--maxw); margin: 8px auto 0; color: var(--muted); font-size: 11px; text-align: center; }
</style>
</head>
<body>
  <header>
    <span class="dot"></span>
    <h1>Cortana Chat</h1>
    <span class="sub" id="status">100% local · nothing leaves this Mac</span>
  </header>

  <div id="log">
    <div class="wrap" id="wrap">
      <div class="empty" id="empty">
        <h2>Chat with your local model</h2>
        <p>Runs entirely on-device. Ask anything.</p>
      </div>
    </div>
  </div>

  <footer>
    <form id="form">
      <textarea id="input" rows="1" placeholder="Message the local model…  (Enter to send, Shift+Enter for newline)" autofocus></textarea>
      <button id="send" type="submit">Send</button>
    </form>
    <div class="hint">Streamed token-by-token from your on-device LLM · <span id="model">local</span></div>
  </footer>

<script>
(function () {
  "use strict";
  const log = document.getElementById("log");
  const wrap = document.getElementById("wrap");
  const empty = document.getElementById("empty");
  const form = document.getElementById("form");
  const input = document.getElementById("input");
  const send = document.getElementById("send");
  const history = [];              // [{role, content}, ...] sent to the server each turn
  let streaming = false;

  function autosize() { input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 180) + "px"; }
  input.addEventListener("input", autosize);

  function addMsg(role, text) {
    if (empty) empty.remove();
    const el = document.createElement("div");
    el.className = "msg " + role;
    const who = document.createElement("div");
    who.className = "who";
    who.textContent = role === "user" ? "You" : "AI";
    const body = document.createElement("div");
    body.className = "body";
    body.textContent = text || "";
    el.appendChild(who); el.appendChild(body);
    wrap.appendChild(el);
    log.scrollTop = log.scrollHeight;
    return body;
  }

  async function stream(bodyEl) {
    const cursor = document.createElement("span");
    cursor.className = "cursor";
    bodyEl.appendChild(cursor);
    const resp = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ messages: history }),
    });
    if (!resp.ok) {
      let msg = "request failed (" + resp.status + ")";
      try { msg = (await resp.json()).error || msg; } catch (e) {}
      cursor.remove(); bodyEl.textContent = "⚠ " + msg;
      return "";
    }
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "", full = "";
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      let idx;
      while ((idx = buffer.indexOf("\n\n")) !== -1) {
        const frame = buffer.slice(0, idx).trim();
        buffer = buffer.slice(idx + 2);
        if (!frame.startsWith("data:")) continue;
        const data = frame.slice(5).trim();
        if (data === "[DONE]") { cursor.remove(); return full; }
        try {
          const tok = JSON.parse(data).token || "";
          full += tok;
          bodyEl.insertBefore(document.createTextNode(tok), cursor);
          log.scrollTop = log.scrollHeight;
        } catch (e) {}
      }
    }
    cursor.remove();
    return full;
  }

  async function submit() {
    const text = input.value.trim();
    if (!text || streaming) return;
    streaming = true; send.disabled = true;
    input.value = ""; autosize();
    addMsg("user", text);
    history.push({ role: "user", content: text });
    const bodyEl = addMsg("assistant", "");
    try {
      const reply = await stream(bodyEl);
      history.push({ role: "assistant", content: reply });
    } catch (e) {
      bodyEl.textContent = "⚠ " + (e && e.message ? e.message : "connection error");
    } finally {
      streaming = false; send.disabled = false; input.focus();
    }
  }

  form.addEventListener("submit", function (e) { e.preventDefault(); submit(); });
  input.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); submit(); }
  });
})();
</script>
</body>
</html>
